<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>NFC Vault</title>
  <script src="lib/react.production.min.js"></script>
  <script src="lib/react-dom.production.min.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--surface:#0c1929;--surface2:#112238;--line:#20354d;--text:#edf7ff;--muted:#8da2b8;--faint:#60758c;--aqua:#41e6cb;--blue:#62a9ff;--amber:#ffc766;--red:#ff7d8a;--purple:#b69cff;--shadow:0 18px 48px #02081280;--radius:22px;font-size:16px}
    *{box-sizing:border-box}
    html,body,#root{min-height:100%;margin:0}
    body{background:radial-gradient(circle at 18% -10%,#143c4c 0,transparent 32rem),radial-gradient(circle at 96% 20%,#182c50 0,transparent 34rem),var(--bg);color:var(--text);font:400 1rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
    body.large-text{font-size:19px} body.high-contrast{--bg:#000;--surface:#071018;--surface2:#0d1b28;--line:#52708c;--muted:#c4d2df;--faint:#a6bacd;--aqua:#69ffe5;--blue:#82bcff}
    button,input,select,textarea{font:inherit} button{min-height:44px;border:0;cursor:pointer} button:disabled{cursor:not-allowed;opacity:.48}
    :focus-visible{outline:3px solid var(--amber);outline-offset:3px}
    a{color:#87c4ff}.app{min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
    .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;min-height:74px;padding:10px max(18px,calc((100vw - 1120px)/2));border-bottom:1px solid #ffffff10;background:#07111ee6;backdrop-filter:blur(18px)}
    .logo{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#1d6c72,#133453);box-shadow:inset 0 1px #ffffff28,0 8px 22px #0007;font-weight:900;color:var(--aqua);letter-spacing:-2px}.brand{font-weight:760;letter-spacing:-.02em}.subtitle{font-size:.76rem;color:var(--muted)}
    .status{margin-left:auto;display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#0b1725;color:var(--muted);font-size:.76rem}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}.status.ready .status-dot{background:var(--aqua);box-shadow:0 0 12px var(--aqua)}.status.disabled .status-dot{background:var(--amber)}.status.unavailable .status-dot{background:var(--red)}
    .main{width:min(1120px,100%);margin:auto;padding:24px 18px}.page-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{color:var(--aqua);font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.page-head h1{margin:3px 0 0;font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.1;letter-spacing:-.04em}.page-head p{margin:7px 0 0;color:var(--muted);max-width:650px}
    .grid{display:grid;gap:16px}.two{grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr)}.three{grid-template-columns:repeat(3,1fr)}
    .panel{background:linear-gradient(145deg,#0e1c2d,#0a1624);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.pad{padding:20px}.soft{background:#ffffff06;border:1px solid #ffffff0d;border-radius:16px}
    .hero{position:relative;overflow:hidden;min-height:360px;padding:clamp(24px,5vw,48px);display:flex;flex-direction:column;justify-content:center}.hero:before{content:"";position:absolute;width:360px;height:360px;border-radius:50%;right:-90px;top:-120px;background:radial-gradient(circle,#41e6cb30,transparent 65%)}.hero-copy{position:relative;max-width:580px}.hero h2{font-size:clamp(2rem,6vw,3.6rem);line-height:1.02;letter-spacing:-.055em;margin:10px 0 16px}.hero h2 span{color:var(--aqua)}.hero p{color:var(--muted);max-width:510px;margin:0 0 26px;font-size:1.02rem}
    .primary,.secondary,.danger,.ghost{border-radius:14px;padding:11px 17px;font-weight:760;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary{color:#04201c;background:linear-gradient(135deg,#65f3dc,#32cdb9);box-shadow:0 10px 28px #27cbb53b}.secondary{color:#ddebff;background:#182d44;border:1px solid #2d4966}.danger{color:#ffdce0;background:#4a1d29;border:1px solid #793342}.ghost{color:var(--muted);background:transparent;border:1px solid var(--line)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .quick{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{padding:18px}.stat-value{font-size:1.65rem;font-weight:800;letter-spacing:-.04em}.stat-label{font-size:.78rem;color:var(--muted);margin-top:2px}
    .scanner{min-height:360px;display:grid;place-items:center;text-align:center;padding:30px}.scan-orb{width:138px;height:138px;position:relative;display:grid;place-items:center;margin:auto}.scan-orb:before,.scan-orb:after{content:"";position:absolute;inset:16px;border:2px solid var(--aqua);border-radius:50%;animation:ring 1.8s ease-out infinite}.scan-orb:after{animation-delay:.65s}.scan-core{width:74px;height:74px;display:grid;place-items:center;border-radius:24px;background:#143d45;border:1px solid #48dfca80;color:var(--aqua);font-size:1.7rem;font-weight:900}@keyframes ring{0%{transform:scale(.55);opacity:1}100%{transform:scale(1.45);opacity:0}}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 13px}.section-title h2,.section-title h3{margin:0;font-size:1.03rem}.hint{color:var(--muted);font-size:.82rem}.notice{padding:14px 16px;border-radius:14px;background:#142638;border:1px solid #29445e;color:#c5d8e8;font-size:.87rem}.notice.warn{background:#2a2112;border-color:#5d4720;color:#ffe1a1}.notice.good{background:#0d2b29;border-color:#1f5c55;color:#bafff1}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.field{width:100%;min-height:48px;padding:11px 13px;color:var(--text);background:#081522;border:1px solid var(--line);border-radius:13px}.field::placeholder{color:#667c91}.search{flex:1;min-width:190px}.filters{display:flex;gap:8px;overflow:auto;padding:2px 2px 10px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;min-height:38px;padding:7px 12px;border-radius:999px;color:var(--muted);background:#0d1b2b;border:1px solid var(--line);font-size:.8rem}.filter.active{color:#06251f;background:var(--aqua);border-color:var(--aqua);font-weight:800}
    .card-list{display:grid;gap:10px}.vault-card{width:100%;text-align:left;padding:16px;color:inherit;background:linear-gradient(140deg,#102139,#0b1828);border:1px solid var(--line);border-radius:17px;transition:.18s transform,.18s border-color}.vault-card:hover{transform:translateY(-2px);border-color:#3a5c7c}.vault-card.selected{border-color:var(--aqua);box-shadow:0 0 0 1px #41e6cb44}.card-top{display:flex;align-items:start;justify-content:space-between;gap:12px}.card-name{font-weight:780;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.serial{margin-top:4px;color:var(--faint);font:600 .72rem/1.3 ui-monospace,"SFMono-Regular",Consolas,monospace}.badge{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:4px 8px;border-radius:999px;background:#1a2c42;border:1px solid #2b4663;color:#bad0e6;font-size:.69rem;white-space:nowrap}.category{color:var(--aqua);border-color:#29685f;background:#10302f}.techs{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}.tech{padding:3px 7px;border-radius:7px;background:#ffffff08;color:var(--muted);font:600 .66rem ui-monospace,monospace}
    .detail{position:sticky;top:96px;max-height:calc(100vh - 120px);overflow:auto}.detail-hero{padding:20px;border-bottom:1px solid var(--line);background:linear-gradient(145deg,#15304a,#0d1b2b);border-radius:22px 22px 0 0}.detail-body{padding:18px}.detail h2{margin:6px 0 2px;font-size:1.35rem}.meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:14px 0}.meta{padding:11px;background:#081522;border:1px solid #192e43;border-radius:12px;min-width:0}.meta-key{color:var(--faint);font-size:.67rem;text-transform:uppercase;letter-spacing:.08em}.meta-value{margin-top:4px;color:#d8e8f5;font:600 .76rem ui-monospace,monospace;overflow-wrap:anywhere}
    .cap-list{display:grid;gap:8px;margin:13px 0}.cap{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:#0a1724;border:1px solid #172a3c}.cap-mark{width:23px;height:23px;flex:none;border-radius:8px;display:grid;place-items:center;background:#163a37;color:var(--aqua);font-weight:900}.cap.no .cap-mark{background:#30202a;color:var(--red)}.cap-title{font-size:.82rem;font-weight:750}.cap-text{font-size:.72rem;color:var(--muted)}
    details{border:1px solid var(--line);border-radius:14px;background:#081522;margin-top:12px}summary{cursor:pointer;padding:13px 15px;color:#c7d9e8;font-weight:700}.raw{margin:0;padding:0 15px 15px;color:#8fb3c7;white-space:pre-wrap;overflow-wrap:anywhere;font:500 .68rem/1.55 ui-monospace,monospace;max-height:320px;overflow:auto}.records{display:grid;gap:8px}.record{padding:11px 12px;border-radius:12px;background:#0a1928;border:1px solid #1a3147}.record strong{display:block;color:var(--blue);font-size:.72rem}.record span{display:block;margin-top:4px;font-size:.78rem;overflow-wrap:anywhere}
    .empty{text-align:center;padding:56px 20px;color:var(--muted)}.empty-mark{width:64px;height:64px;margin:0 auto 14px;border-radius:22px;background:#13263b;display:grid;place-items:center;color:var(--blue);font-weight:900;font-size:1.25rem}
    .preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.preset{min-height:74px;padding:10px;border-radius:14px;color:var(--muted);background:#0b1827;border:1px solid var(--line)}.preset.active{color:var(--aqua);border-color:var(--aqua);background:#10312f}.preset-code{display:block;font-weight:900;font-size:.75rem;margin-bottom:4px}.form-label{display:block;margin:16px 0 6px;color:#b9cadd;font-size:.78rem;font-weight:740}.write-state{text-align:center;padding:48px 20px}.spinner{width:64px;height:64px;border:4px solid #24445e;border-top-color:var(--aqua);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 18px}@keyframes spin{to{transform:rotate(360deg)}}
    .mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px;margin-bottom:18px;border:1px solid var(--line);border-radius:16px;background:#081522}.mode-tabs button{border-radius:11px;background:transparent;color:var(--muted);font-weight:760}.mode-tabs button.active{background:#17344b;color:var(--text);box-shadow:inset 0 0 0 1px #315979}.copy-source{padding:16px;margin:14px 0;border:1px solid #2b625a;border-radius:16px;background:linear-gradient(140deg,#103530,#0b1d29)}.copy-source strong{display:block}.copy-source .hint{margin-top:4px}.step-list{display:grid;gap:10px;counter-reset:copy-step}.step-item{display:flex;align-items:flex-start;gap:11px;color:var(--muted);font-size:.82rem}.step-item:before{counter-increment:copy-step;content:counter(copy-step);width:25px;height:25px;flex:none;display:grid;place-items:center;border-radius:8px;background:#173a38;color:var(--aqua);font-weight:900}
    .category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.category-card{padding:15px;background:#0b1928;border:1px solid var(--line);border-radius:16px}.category-card strong{font-size:.87rem}.category-card p{margin:5px 0 0;color:var(--muted);font-size:.76rem}.matrix{width:100%;border-collapse:collapse;font-size:.8rem}.matrix th,.matrix td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line)}.matrix th{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em}.yes{color:var(--aqua);font-weight:800}.limited{color:var(--amber);font-weight:800}.no{color:var(--red);font-weight:800}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}.switch-row:last-child{border:0}.switch{width:52px;min-width:52px;border-radius:999px;background:#1c3045;padding:4px;display:flex}.switch span{width:20px;height:20px;border-radius:50%;background:#8396a8;transition:.2s}.switch.on{background:#1a5e55}.switch.on span{transform:translateX(24px);background:var(--aqua)}
    .nav{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;width:min(650px,calc(100% - 24px));padding:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;border:1px solid #294056;border-radius:22px;background:#0a1724ed;backdrop-filter:blur(22px);box-shadow:0 18px 50px #000b}.nav button{border-radius:15px;color:var(--muted);background:transparent;font-size:.72rem;font-weight:720}.nav button.active{color:#06211d;background:var(--aqua)}
    .toast{position:fixed;z-index:100;left:50%;bottom:100px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);padding:11px 15px;border-radius:13px;background:#12322f;border:1px solid #2a746a;color:#d7fff8;box-shadow:var(--shadow);font-size:.84rem}.toast.error{background:#3a1921;border-color:#7f3444;color:#ffdce1}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:780px){.two,.three{grid-template-columns:1fr}.page-head{display:block}.detail{position:static;max-height:none}.hero{min-height:390px}.quick{grid-template-columns:repeat(2,1fr)}.category-grid{grid-template-columns:1fr}.status-label{display:none}.main{padding:18px 14px}.topbar{padding-inline:14px}.preset-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:420px){.meta-grid{grid-template-columns:1fr}.toolbar>.secondary,.toolbar>.ghost{flex:1}.hero{padding:25px 20px}.nav button{font-size:.66rem}.quick{grid-template-columns:1fr 1fr}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}} body.reduce-motion *,body.reduce-motion *:before,body.reduce-motion *:after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  </style>
</head>

</body>
</html>
