<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>NFC Vault</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060c12;color:#c8d8e0;font-family:'IBM Plex Sans',sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:none;font-family:inherit}
input{font-family:inherit}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#1e3040;border-radius:2px}
@keyframes ping{0%{transform:scale(0.4);opacity:0.8}100%{transform:scale(2.2);opacity:0}}
@keyframes fadeSlide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;
const STORAGE_KEY="nfc_saved_cards";

// ── Storage helpers ──
async function loadCards(){try{const r=await window.storage?.get(STORAGE_KEY);return r?JSON.parse(r.value):[]}catch{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}}
async function persistCards(cards){try{await window.storage?.set(STORAGE_KEY,JSON.stringify(cards))}catch{localStorage.setItem(STORAGE_KEY,JSON.stringify(cards))}}

// ── Utilities ──
function hex(n){return n.toString(16).toUpperCase().padStart(2,"0")}
function rnd(){return Math.floor(Math.random()*256)}

// ── Card-type color + label mapping ──
const CARD_TYPES={
  mifare_classic:{label:"MIFARE Classic",color:"#00f5d4",icon:"🔑"},
  mifare_ultralight:{label:"NTAG / Ultralight",color:"#7B61FF",icon:"🏷️"},
  ndef:{label:"NDEF",color:"#00BFFF",icon:"📝"},
  isodep:{label:"ISO-DEP",color:"#FF6B6B",icon:"💳"},
  nfcv:{label:"NFC-V",color:"#FFB800",icon:"📦"},
  nfcf:{label:"FeliCa",color:"#FF69B4",icon:"🚃"},
  nfca:{label:"NFC-A",color:"#4ECDC4",icon:"📡"},
  nfcb:{label:"NFC-B",color:"#95E1D3",icon:"📡"},
  generic:{label:"Unknown",color:"#888",icon:"❓"}
};

function getCardMeta(card){
  const ct=card.cardType||"generic";
  return CARD_TYPES[ct]||CARD_TYPES.generic;
}

// ── Demo card generator with random types ──
function demoCard(){
  const types=["mifare_classic","mifare_ultralight","ndef","isodep","nfcv","nfcf"];
  const pick=types[Math.floor(Math.random()*types.length)];
  const id=Date.now().toString(36);
  const serial=Array.from({length:4},()=>hex(rnd())).join(":");
  const base={id,name:"Card "+new Date().toLocaleTimeString(),scannedAt:new Date().toISOString(),serial,rawId:serial.replace(/:/g,""),cardType:pick};

  if(pick==="mifare_classic"){
    base.tagType="MIFARE Classic 1K";base.manufacturer="NXP - MIFARE Classic 1K";
    base.technologies=["NfcA","MifareClassic","NdefFormatable"];
    base.atqa="0x0004";base.sak="0x08";
    base.memory={total:1024,sectors:16,blocksPerSector:4,bytesPerBlock:16};
    base.sectors=Array.from({length:16},(_,s)=>({sector:s,accessible:Math.random()>0.15,blocks:Array.from({length:4},(_,b)=>({block:s*4+b,isTrailer:b===3,data:Array.from({length:16},()=>hex(rnd())).join(" ")}))}));
  } else if(pick==="mifare_ultralight"){
    base.tagType="NTAG 215";base.manufacturer="NXP Semiconductors";
    base.technologies=["NfcA","MifareUltralight","Ndef"];
    base.atqa="0x4400";base.sak="0x00";base.totalPages=20;
    base.pages=Array.from({length:20},(_,p)=>({page:p,data:Array.from({length:4},()=>hex(rnd())).join(" ")}));
    base.ndefRecords=[{recordType:"URI",decoded:"https://example.com",payloadSize:16}];
  } else if(pick==="ndef"){
    base.tagType="NDEF";base.manufacturer="NXP Semiconductors";
    base.technologies=["NfcA","Ndef"];base.ndefType="org.nfcforum.ndef.type2";
    base.maxSize=504;base.isWritable=true;base.messageSize=42;
    base.ndefRecords=[{recordType:"URI",decoded:"https://nfcvault.app",payloadSize:18},{recordType:"TEXT",decoded:"Hello NFC World!",payloadSize:20}];
  } else if(pick==="isodep"){
    base.tagType="ISO-DEP / Smart Card";base.manufacturer="NXP Semiconductors";
    base.technologies=["NfcA","IsoDep"];base.atqa="0x0004";base.sak="0x20";
    base.historicalBytes=Array.from({length:12},()=>hex(rnd())).join(" ");
    base.maxTransceiveLength=253;base.timeout=2000;
    base.apdus=[{command:"SELECT (no AID)",sent:"00 A4 04 00 00",response:Array.from({length:8},()=>hex(rnd())).join(" "),sw:"9000"}];
  } else if(pick==="nfcv"){
    base.tagType="NFC-V / ISO 15693";base.manufacturer="STMicroelectronics";
    base.technologies=["NfcV"];base.dsfId="0x00";base.responseFlags="0x00";
    base.totalBlocks=16;
    base.blocks=Array.from({length:16},(_,i)=>({block:i,data:Array.from({length:4},()=>hex(rnd())).join(" ")}));
  } else if(pick==="nfcf"){
    base.tagType="NFC-F / FeliCa";base.manufacturer="Sony";
    base.technologies=["NfcF"];
    base.idm=Array.from({length:8},()=>hex(rnd())).join(" ");
    base.pmm=Array.from({length:8},()=>hex(rnd())).join(" ");
    base.systemCode="88 B4";base.maxTransceiveLength=252;
  }
  return base;
}

// ── NFC Callbacks ──
window.NfcCallbacks={
  onCardRead:(j)=>{try{window.__nfcRR&&window.__nfcRR(JSON.parse(j))}catch(e){console.error("onCardRead parse error",e)}},
  onReadError:(m)=>{window.__nfcRE&&window.__nfcRE(m)},
  onWriteComplete:(j)=>{try{window.__nfcWD&&window.__nfcWD(JSON.parse(j))}catch(e){}},
  onWriteError:(m)=>{window.__nfcWE&&window.__nfcWE(m)}
};

// ── Styled helpers ──
const btnS=(c,sm=false)=>({background:c+"18",border:"1px solid "+c+"55",color:c,borderRadius:sm?8:10,padding:sm?"5px 12px":"9px 18px",fontSize:sm?11:12,fontFamily:"'IBM Plex Mono',monospace",transition:"all .15s"});
const mono={fontFamily:"'IBM Plex Mono',monospace"};

// ── Type Badge Component ──
const TypeBadge=({card})=>{
  const meta=getCardMeta(card);
  return(<div style={{display:"inline-flex",alignItems:"center",gap:4,background:meta.color+"18",border:"1px solid "+meta.color+"40",borderRadius:6,padding:"2px 8px"}}>
    <span style={{fontSize:10}}>{meta.icon}</span>
    <span style={{fontSize:10,color:meta.color,...mono,fontWeight:600}}>{meta.label}</span>
  </div>);
};

// ── Scan Animation ──
const ScanRings=()=>(<div style={{position:"relative",width:120,height:120,margin:"0 auto"}}>
  {[0,1,2].map(i=>(<div key={i} style={{position:"absolute",inset:0,border:"2px solid #00f5d4",borderRadius:"50%",opacity:0,animation:"ping 2s ease-out "+i*0.6+"s infinite"}}/>))}
  <div style={{position:"absolute",inset:"50%",transform:"translate(-50%,-50%)",width:60,height:60,background:"radial-gradient(circle,#00f5d422 0%,transparent 70%)",border:"2px solid #00f5d4",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26}}>📡</div>
</div>);

// ── Card Chip (list item) ──
const CardChip=({card,onClick,selected})=>{
  const meta=getCardMeta(card);
  return(<div onClick={onClick} style={{background:selected?"linear-gradient(135deg,#0d2a2a,#0a1f1f)":"linear-gradient(135deg,#111820,#0c1218)",border:"1px solid "+(selected?meta.color:"#1e2d38"),borderRadius:12,padding:"14px 16px",cursor:"pointer",transition:"all .2s",boxShadow:selected?"0 0 16px "+meta.color+"22":"none",position:"relative",overflow:"hidden",marginBottom:8}}>
    {selected&&<div style={{position:"absolute",top:0,left:0,right:0,height:1,background:"linear-gradient(90deg,transparent,"+meta.color+",transparent)"}}/>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13,fontWeight:700,color:selected?meta.color:"#c8d8e0",...mono,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{card.name}</div>
        <div style={{fontSize:11,color:"#4a6070",marginTop:3,...mono}}>{card.serial}</div>
      </div>
      <TypeBadge card={card}/>
    </div>
    <div style={{marginTop:8,display:"flex",gap:6,flexWrap:"wrap"}}>
      {(card.technologies||[]).map(t=>(<span key={t} style={{background:"#ffffff08",border:"1px solid #ffffff12",borderRadius:4,padding:"1px 6px",fontSize:9,color:"#5a7888",...mono}}>{t}</span>))}
    </div>
    <div style={{marginTop:6,fontSize:10,color:"#2a4050",...mono}}>{new Date(card.scannedAt).toLocaleString()}</div>
  </div>);
};

// ── Sector Row (MIFARE Classic) ──
const SectorRow=({sector,expanded,toggle})=>(<div style={{marginBottom:4}}>
  <div onClick={toggle} style={{display:"flex",alignItems:"center",gap:10,background:"#0c1820",borderRadius:8,padding:"8px 12px",cursor:"pointer",border:"1px solid #1a2830"}}>
    <div style={{width:28,height:28,borderRadius:6,flexShrink:0,background:sector.accessible?"#00f5d415":"#ff444415",border:"1px solid "+(sector.accessible?"#00f5d440":"#ff444440"),display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:sector.accessible?"#00f5d4":"#ff4444",...mono}}>S{sector.sector}</div>
    <div style={{flex:1,fontSize:10,color:"#4a6070",...mono}}>Blocks {sector.sector*4}-{sector.sector*4+3}{!sector.accessible&&" - locked"}</div>
    <div style={{fontSize:10,color:"#2a4050"}}>{expanded?"▲":"▼"}</div>
  </div>
  {expanded&&(<div style={{marginTop:2,paddingLeft:8}}>
    {sector.blocks.map(b=>(<div key={b.block} style={{display:"flex",gap:8,alignItems:"center",padding:"5px 10px",background:b.isTrailer?"#1a1000":"#090f14",borderLeft:"2px solid "+(b.isTrailer?"#ffb800":"#1a2830"),borderRadius:"0 4px 4px 0",marginBottom:2}}>
      <div style={{width:22,fontSize:9,color:b.isTrailer?"#ffb800":"#3a5060",...mono,flexShrink:0}}>B{b.block}</div>
      <div style={{...mono,fontSize:10,color:"#7ab8c0",letterSpacing:.5,flex:1,wordBreak:"break-all"}}>{b.data}</div>
      {b.isTrailer&&<span style={{fontSize:9,color:"#ffb80060"}}>KEY</span>}
    </div>))}
  </div>)}
</div>);

// ── Page Grid (NTAG / Ultralight) ──
const PageGrid=({pages})=>(<div style={{maxHeight:320,overflowY:"auto"}}>
  {(pages||[]).map(p=>(<div key={p.page} style={{display:"flex",gap:8,alignItems:"center",padding:"5px 10px",background:p.page<4?"#1a1000":"#090f14",borderLeft:"2px solid "+(p.page<4?"#7B61FF":"#1a2830"),borderRadius:"0 4px 4px 0",marginBottom:2}}>
    <div style={{width:24,fontSize:9,color:p.page<4?"#7B61FF":"#3a5060",...mono,flexShrink:0}}>P{p.page}</div>
    <div style={{...mono,fontSize:10,color:"#a080e0",letterSpacing:.5,flex:1,wordBreak:"break-all"}}>{p.data}</div>
    {p.page<4&&<span style={{fontSize:9,color:"#7B61FF60"}}>{["UID","UID","Lock","CC"][p.page]}</span>}
  </div>))}
</div>);

// ── NDEF Records Display ──
const NdefRecords=({records})=>(<div>
  {(records||[]).map((r,i)=>{
    const isUri=r.recordType==="URI";
    const isText=r.recordType==="TEXT";
    const color=isUri?"#00BFFF":isText?"#4ECDC4":"#FFB800";
    return(<div key={i} style={{background:"#090f14",border:"1px solid #1a2830",borderRadius:8,padding:"10px 14px",marginBottom:6}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
        <span style={{background:color+"18",border:"1px solid "+color+"40",borderRadius:4,padding:"1px 8px",fontSize:10,color,...mono}}>{r.recordType}</span>
        <span style={{fontSize:9,color:"#3a5060",...mono}}>{r.payloadSize}B</span>
      </div>
      {isUri?<a href={r.decoded} target="_blank" rel="noopener" style={{fontSize:12,color:"#00BFFF",...mono,wordBreak:"break-all",textDecoration:"underline"}}>{r.decoded}</a>
       :<div style={{fontSize:12,color:"#c8d8e0",...mono,wordBreak:"break-all"}}>{r.decoded||"(empty)"}</div>}
      {r.mimeType&&<div style={{fontSize:10,color:"#4a6070",...mono,marginTop:4}}>MIME: {r.mimeType}</div>}
    </div>);
  })}
</div>);

// ── APDU Log (ISO-DEP) ──
const ApduLog=({apdus})=>(<div>
  {(apdus||[]).map((a,i)=>(<div key={i} style={{background:"#090f14",border:"1px solid #1a2830",borderRadius:8,padding:"10px 14px",marginBottom:6}}>
    <div style={{fontSize:10,color:"#FF6B6B",...mono,marginBottom:4}}>{a.command}</div>
    <div style={{display:"flex",gap:6,alignItems:"flex-start",marginBottom:4}}>
      <span style={{fontSize:9,color:"#3a5060",flexShrink:0,...mono}}>TX→</span>
      <span style={{fontSize:10,color:"#c88080",...mono,wordBreak:"break-all"}}>{a.sent}</span>
    </div>
    <div style={{display:"flex",gap:6,alignItems:"flex-start"}}>
      <span style={{fontSize:9,color:"#3a5060",flexShrink:0,...mono}}>RX←</span>
      <span style={{fontSize:10,color:"#80c880",...mono,wordBreak:"break-all"}}>{a.response}</span>
    </div>
    <div style={{textAlign:"right",marginTop:4}}>
      <span style={{fontSize:9,padding:"1px 6px",borderRadius:3,background:a.sw==="9000"?"#00f5d418":"#ff444418",color:a.sw==="9000"?"#00f5d4":"#ff4444",...mono}}>SW: {a.sw}</span>
    </div>
  </div>))}
</div>);

// ── Block Grid (NFC-V) ──
const BlockGrid=({blocks})=>(<div style={{maxHeight:320,overflowY:"auto"}}>
  {(blocks||[]).map(b=>(<div key={b.block} style={{display:"flex",gap:8,alignItems:"center",padding:"5px 10px",background:"#090f14",borderLeft:"2px solid #FFB80040",borderRadius:"0 4px 4px 0",marginBottom:2}}>
    <div style={{width:24,fontSize:9,color:"#FFB800",...mono,flexShrink:0}}>B{b.block}</div>
    <div style={{...mono,fontSize:10,color:"#e0c070",letterSpacing:.5,flex:1,wordBreak:"break-all"}}>{b.data}</div>
  </div>))}
</div>);

// ── FeliCa Detail ──
const FeliCaDetail=({card})=>(<div style={{background:"#090f14",border:"1px solid #1a2830",borderRadius:10,overflow:"hidden"}}>
  {[["IDm",card.idm],["PMm",card.pmm],["System Code",card.systemCode],["Max Transceive",card.maxTransceiveLength+"B"]].map(([k,v],i)=>v&&(
    <div key={k} style={{display:"flex",padding:"9px 14px",borderBottom:i<3?"1px solid #111e28":"none",gap:10}}>
      <div style={{width:100,fontSize:10,color:"#FF69B4",...mono,flexShrink:0}}>{k}</div>
      <div style={{fontSize:11,color:"#e0a0c0",...mono,wordBreak:"break-all"}}>{v}</div>
    </div>
  ))}
</div>);

// ── Raw Hex Toggle ──
const RawHexDump=({card})=>{
  const data=JSON.stringify(card,null,2);
  return(<div style={{background:"#090f14",border:"1px solid #1a2830",borderRadius:10,padding:"12px",maxHeight:300,overflowY:"auto"}}>
    <pre style={{...mono,fontSize:9,color:"#4a6870",whiteSpace:"pre-wrap",wordBreak:"break-all",margin:0}}>{data}</pre>
  </div>);
};

// ════════════════════════════════════════════════════
//  DETAIL PANEL — renders data based on card type
// ════════════════════════════════════════════════════
function DetailPanel({card,onSave,onWrite,onRename,showActions=true}){
  const[expanded,setExpanded]=useState({});
  const[showRaw,setShowRaw]=useState(false);
  const[editName,setEditName]=useState(false);
  const[nameVal,setNameVal]=useState(card.name);
  const nameRef=useRef();
  const meta=getCardMeta(card);

  useEffect(()=>{if(editName&&nameRef.current)nameRef.current.focus()},[editName]);

  // Build info fields based on card type
  const fields=[];
  fields.push(["Tag Type",card.tagType]);
  if(card.manufacturer)fields.push(["Manufacturer",card.manufacturer]);
  fields.push(["Serial",card.serial]);
  if(card.atqa)fields.push(["ATQA",card.atqa]);
  if(card.sak)fields.push(["SAK",card.sak]);
  if(card.memory)fields.push(["Memory",(card.memory.total/1024)+"KB — "+card.memory.sectors+"×"+card.memory.blocksPerSector+" blocks"]);
  if(card.ndefType)fields.push(["NDEF Type",card.ndefType]);
  if(card.maxSize!=null)fields.push(["Max Size",card.maxSize+"B"]);
  if(card.isWritable!=null)fields.push(["Writable",card.isWritable?"Yes":"No"]);
  if(card.messageSize!=null)fields.push(["Message Size",card.messageSize+"B"]);
  if(card.historicalBytes)fields.push(["Historical Bytes",card.historicalBytes]);
  if(card.hiLayerResponse)fields.push(["HiLayer Response",card.hiLayerResponse]);
  if(card.dsfId)fields.push(["DSF ID",card.dsfId]);
  if(card.responseFlags)fields.push(["Response Flags",card.responseFlags]);
  if(card.applicationData)fields.push(["App Data",card.applicationData]);
  if(card.protocolInfo)fields.push(["Protocol Info",card.protocolInfo]);
  if(card.totalPages!=null)fields.push(["Pages",card.totalPages]);
  if(card.totalBlocks!=null)fields.push(["Blocks",card.totalBlocks]);

  const canWrite=card.cardType==="mifare_classic"||card.cardType==="mifare_ultralight";

  return(<div>
    {/* Header */}
    <div style={{background:"linear-gradient(135deg,"+meta.color+"10,#091820)",border:"1px solid "+meta.color+"30",borderRadius:12,padding:"14px 16px",marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        {editName?(
          <div style={{display:"flex",gap:6,flex:1}}>
            <input ref={nameRef} value={nameVal} onChange={e=>setNameVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&(onRename&&onRename(nameVal),setEditName(false))} style={{flex:1,background:"#0a1820",border:"1px solid "+meta.color,borderRadius:6,color:meta.color,padding:"4px 8px",...mono,fontSize:13,outline:"none"}}/>
            <button onClick={()=>{onRename&&onRename(nameVal);setEditName(false)}} style={btnS(meta.color,true)}>✓</button>
            <button onClick={()=>setEditName(false)} style={btnS("#ff4444",true)}>✕</button>
          </div>
        ):(
          <div style={{fontSize:14,fontWeight:700,color:meta.color,...mono,cursor:"pointer"}} onClick={()=>{setNameVal(card.name);setEditName(true)}}>
            {card.name} <span style={{fontSize:11,opacity:.4}}>✎</span>
          </div>
        )}
        <TypeBadge card={card}/>
      </div>
      <div style={{fontSize:10,color:"#2a4050",...mono,marginTop:6}}>{new Date(card.scannedAt).toLocaleString()}</div>
    </div>

    {/* Info Fields */}
    <div style={{background:"#090f14",border:"1px solid #1a2830",borderRadius:12,overflow:"hidden",marginBottom:12}}>
      {fields.map(([k,v],i)=>(
        <div key={k} style={{display:"flex",padding:"9px 14px",borderBottom:i<fields.length-1?"1px solid #111e28":"none",gap:10}}>
          <div style={{width:90,fontSize:10,color:"#4a6070",...mono,flexShrink:0,paddingTop:1}}>{k}</div>
          <div style={{fontSize:11,color:"#a0c8d0",...mono,wordBreak:"break-all"}}>{String(v)}</div>
        </div>
      ))}
    </div>

    {/* Action Buttons */}
    {showActions&&<div style={{display:"flex",gap:8,marginBottom:14}}>
      {onSave&&<button onClick={()=>onSave(card)} style={{...btnS("#00f5d4"),flex:1,padding:"10px",textAlign:"center"}}>💾 Save</button>}
      {canWrite&&onWrite&&<button onClick={()=>onWrite(card)} style={{...btnS("#ffb800"),flex:1,padding:"10px",textAlign:"center"}}>✍️ Write</button>}
    </div>}

    {/* Card-Type Specific Data */}
    {card.cardType==="mifare_classic"&&card.sectors?.length>0&&<>
      <div style={{fontSize:10,color:"#4a6070",...mono,marginBottom:6,letterSpacing:1}}>SECTORS ({card.sectors.length})</div>
      <div style={{maxHeight:320,overflowY:"auto",marginBottom:12}}>
        {card.sectors.map(s=>(<SectorRow key={s.sector} sector={s} expanded={!!expanded[s.sector]} toggle={()=>setExpanded(e=>({...e,[s.sector]:!e[s.sector]}))}/>))}
      </div>
    </>}

    {card.cardType==="mifare_ultralight"&&card.pages?.length>0&&<>
      <div style={{fontSize:10,color:"#7B61FF",...mono,marginBottom:6,letterSpacing:1}}>PAGES ({card.pages.length})</div>
      <PageGrid pages={card.pages}/>
      <div style={{marginBottom:12}}/>
    </>}

    {card.ndefRecords?.length>0&&<>
      <div style={{fontSize:10,color:"#00BFFF",...mono,marginBottom:6,letterSpacing:1}}>NDEF RECORDS ({card.ndefRecords.length})</div>
      <NdefRecords records={card.ndefRecords}/>
      <div style={{marginBottom:12}}/>
    </>}

    {card.cardType==="isodep"&&card.apdus?.length>0&&<>
      <div style={{fontSize:10,color:"#FF6B6B",...mono,marginBottom:6,letterSpacing:1}}>APDU LOG</div>
      <ApduLog apdus={card.apdus}/>
      <div style={{marginBottom:12}}/>
    </>}

    {card.cardType==="nfcv"&&card.blocks?.length>0&&<>
      <div style={{fontSize:10,color:"#FFB800",...mono,marginBottom:6,letterSpacing:1}}>BLOCKS ({card.blocks.length})</div>
      <BlockGrid blocks={card.blocks}/>
      <div style={{marginBottom:12}}/>
    </>}

    {card.cardType==="nfcf"&&<>
      <div style={{fontSize:10,color:"#FF69B4",...mono,marginBottom:6,letterSpacing:1}}>FELICA DATA</div>
      <FeliCaDetail card={card}/>
      <div style={{marginBottom:12}}/>
    </>}

    {/* Raw Hex Toggle */}
    <button onClick={()=>setShowRaw(!showRaw)} style={{width:"100%",background:"none",border:"1px solid #1a2830",borderRadius:10,padding:"8px",color:"#3a5060",fontSize:11,...mono,marginBottom:8}}>
      {showRaw?"▲ Hide":"▼ Show"} Raw Data
    </button>
    {showRaw&&<RawHexDump card={card}/>}
  </div>);
}

// ════════════════════════════════════════════════════
//  MAIN APP
// ════════════════════════════════════════════════════
function App(){
  const[tab,setTab]=useState("scan");
  const[scanning,setScanning]=useState(false);
  const[scannedCard,setScanned]=useState(null);
  const[savedCards,setSaved]=useState([]);
  const[selected,setSelected]=useState(null);
  const[toast,setToast]=useState(null);
  const[writeStep,setWriteStep]=useState("select");
  const[writeTarget,setWriteTarget]=useState(null);
  const nativeNfc=typeof window.NfcBridge!=="undefined";

  useEffect(()=>{loadCards().then(setSaved)},[]);

  const showToast=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast(null),2500)};

  const startScan=()=>{
    setScanning(true);setScanned(null);
    if(nativeNfc){
      window.NfcBridge.startReadMode();
      window.__nfcRR=(card)=>{
        card.id=Date.now().toString(36);
        card.name=(card.tagType||"Card")+" "+new Date().toLocaleTimeString();
        if(!card.scannedAt)card.scannedAt=new Date().toISOString();
        if(!card.cardType)card.cardType="generic";
        setScanned(card);setScanning(false);
        showToast("Card scanned!");window.__nfcRR=null;
      };
      window.__nfcRE=(msg)=>{setScanning(false);showToast("Error: "+msg,"err");window.__nfcRE=null};
    } else {
      setTimeout(()=>{setScanned(demoCard());setScanning(false);showToast("Scanned (demo)")},2200);
    }
  };

  const saveCard=async(card)=>{
    const u=[card,...savedCards.filter(c=>c.id!==card.id)];
    setSaved(u);await persistCards(u);showToast("Saved to library");
  };

  const deleteCard=async(id)=>{
    const u=savedCards.filter(c=>c.id!==id);setSaved(u);await persistCards(u);
    if(selected?.id===id)setSelected(null);showToast("Deleted","err");
  };

  const renameCard=async(card,newName)=>{
    if(!newName?.trim())return;
    const u=savedCards.map(c=>c.id===card.id?{...c,name:newName.trim()}:c);
    setSaved(u);await persistCards(u);
    if(selected?.id===card.id)setSelected(s=>({...s,name:newName.trim()}));
    if(scannedCard?.id===card.id)setScanned(s=>({...s,name:newName.trim()}));
    showToast("Renamed");
  };

  const goToWrite=(card)=>{setWriteTarget(card);setTab("write");setWriteStep("confirm")};

  const doWrite=(card)=>{
    setWriteStep("writing");
    if(nativeNfc){
      window.NfcBridge.startWriteMode(JSON.stringify(card));
      window.__nfcWD=(r)=>{setWriteStep("done");showToast("Written: "+r.written+" blocks");window.__nfcWD=null};
      window.__nfcWE=(msg)=>{setWriteStep("confirm");showToast("Write error: "+msg,"err");window.__nfcWE=null};
    } else {
      setTimeout(()=>setWriteStep("done"),2800);
    }
  };

  // Which cards can be written
  const writableCards=savedCards.filter(c=>c.cardType==="mifare_classic"||c.cardType==="mifare_ultralight");

  return(<div style={{minHeight:"100vh",background:"#060c12"}}>
    {/* Header */}
    <div style={{borderBottom:"1px solid #0e1e28",padding:"14px 16px",display:"flex",alignItems:"center",gap:10,position:"sticky",top:0,zIndex:10,background:"#060c12ee",backdropFilter:"blur(12px)"}}>
      <div style={{width:34,height:34,borderRadius:10,background:"#00f5d415",border:"1px solid #00f5d440",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>📡</div>
      <div>
        <div style={{fontSize:14,fontWeight:600,color:"#e0f0f4"}}>NFC Vault</div>
        <div style={{fontSize:9,color:nativeNfc?"#00f5d4":"#3a5060",...mono}}>{nativeNfc?"● Native NFC Ready":"◌ Demo Mode"}</div>
      </div>
      <div style={{marginLeft:"auto",fontSize:11,color:"#2a4050",...mono}}>{savedCards.length} saved</div>
    </div>

    {/* Tabs */}
    <div style={{display:"flex",borderBottom:"1px solid #0e1e28",background:"#060c12ee",backdropFilter:"blur(12px)",position:"sticky",top:54,zIndex:9}}>
      {[["scan","📡 Scan"],["library","🗂 Library"],["write","✍️ Write"]].map(([id,label])=>(
        <button key={id} onClick={()=>setTab(id)} style={{flex:1,padding:"11px 0",background:"none",color:tab===id?"#00f5d4":"#3a5060",borderBottom:"2px solid "+(tab===id?"#00f5d4":"transparent"),fontSize:12,fontWeight:tab===id?600:400,letterSpacing:.3}}>{label}</button>
      ))}
    </div>

    {/* Content */}
    <div style={{padding:"18px 14px",maxWidth:520,margin:"0 auto"}}>

      {/* ── SCAN TAB ── */}
      {tab==="scan"&&<div style={{animation:"fadeSlide .3s ease"}}>
        {!scanning&&!scannedCard&&(
          <div style={{textAlign:"center",paddingTop:32}}>
            <div style={{width:110,height:110,margin:"0 auto 20px",background:"radial-gradient(circle,#00f5d412,transparent)",border:"1px solid #00f5d430",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:38}}>📡</div>
            <div style={{fontSize:17,fontWeight:600,color:"#c8e4e8",marginBottom:8}}>Ready to Scan</div>
            <div style={{fontSize:12,color:"#3a5060",marginBottom:28,lineHeight:1.8}}>
              MIFARE Classic · NTAG · NDEF<br/>ISO-DEP · FeliCa · NFC-V · ISO 14443
            </div>
            <button onClick={startScan} style={{background:"linear-gradient(135deg,#00f5d4,#00c4a8)",color:"#060c12",borderRadius:12,padding:"13px 36px",fontSize:14,fontWeight:700,boxShadow:"0 0 24px #00f5d440",letterSpacing:.3}}>Hold Card &amp; Scan</button>
            {!nativeNfc&&<div style={{marginTop:18,background:"#1a1000",border:"1px solid #ffb80030",borderRadius:10,padding:"10px 14px",fontSize:10,color:"#ffb80080",...mono,lineHeight:1.7}}>⚠ Demo mode — install APK for real NFC</div>}
          </div>
        )}
        {scanning&&<div style={{textAlign:"center",paddingTop:40}}>
          <ScanRings/>
          <div style={{marginTop:24,fontSize:13,color:"#00f5d4",...mono}}>Scanning…</div>
          <div style={{fontSize:11,color:"#3a5060",marginTop:6}}>Hold card near back of device</div>
        </div>}
        {!scanning&&scannedCard&&<div style={{animation:"fadeSlide .3s ease"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <div style={{fontSize:12,color:"#00f5d4",...mono}}>✓ Card detected</div>
            <button onClick={()=>setScanned(null)} style={btnS("#3a5060",true)}>✕ Clear</button>
          </div>
          <DetailPanel card={scannedCard} onSave={saveCard} onWrite={goToWrite} onRename={(name)=>renameCard(scannedCard,name)}/>
          <button onClick={startScan} style={{width:"100%",marginTop:10,background:"none",border:"1px solid #1a2830",borderRadius:10,padding:"10px",color:"#3a5060",fontSize:12}}>Scan another</button>
        </div>}
      </div>}

      {/* ── LIBRARY TAB ── */}
      {tab==="library"&&<div style={{animation:"fadeSlide .3s ease"}}>
        {savedCards.length===0?
          <div style={{textAlign:"center",paddingTop:60,color:"#2a4050"}}>
            <div style={{fontSize:34,marginBottom:12}}>🗂</div>
            <div style={{fontSize:12}}>No saved cards yet</div>
          </div>
        :<>
          {savedCards.map(c=>(
            <CardChip key={c.id} card={c} selected={selected?.id===c.id} onClick={()=>setSelected(s=>s?.id===c.id?null:c)}/>
          ))}
          {selected&&<div style={{borderTop:"1px solid #0e1e28",paddingTop:14,animation:"fadeSlide .25s ease"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div style={{fontSize:10,color:"#4a6070",...mono,letterSpacing:1}}>DETAIL</div>
              <button onClick={()=>deleteCard(selected.id)} style={btnS("#ff4444",true)}>🗑 Delete</button>
            </div>
            <DetailPanel card={selected} onSave={saveCard} onWrite={goToWrite} onRename={(name)=>renameCard(selected,name)}/>
          </div>}
        </>}
      </div>}

      {/* ── WRITE TAB ── */}
      {tab==="write"&&<div style={{animation:"fadeSlide .3s ease"}}>
        {writeStep==="select"&&<>
          <div style={{fontSize:10,color:"#4a6070",...mono,letterSpacing:1,marginBottom:10}}>SELECT CARD TO CLONE</div>
          {writableCards.length===0?
            <div style={{textAlign:"center",paddingTop:40,color:"#2a4050",fontSize:12}}>
              <div style={{fontSize:28,marginBottom:8}}>✍️</div>
              No writable cards saved.<br/>Scan a MIFARE Classic or NTAG card first.
            </div>
          :writableCards.map(c=>(
            <CardChip key={c.id} card={c} selected={writeTarget?.id===c.id} onClick={()=>setWriteTarget(s=>s?.id===c.id?null:c)}/>
          ))}
          {writeTarget&&<button onClick={()=>setWriteStep("confirm")} style={{width:"100%",marginTop:14,background:"linear-gradient(135deg,#ffb800,#e09000)",color:"#060c12",borderRadius:12,padding:"13px",fontSize:13,fontWeight:700,boxShadow:"0 0 20px #ffb80040"}}>✍️ Write "{writeTarget.name}"</button>}
        </>}

        {writeStep==="confirm"&&writeTarget&&<div>
          <div style={{background:"#1a1000",border:"1px solid #ffb80040",borderRadius:12,padding:"14px",marginBottom:14}}>
            <div style={{fontSize:12,color:"#ffb800",...mono,marginBottom:6}}>⚠ Confirm Write</div>
            <div style={{fontSize:11,color:"#906030",lineHeight:1.7}}>Overwrites ALL data on target card with <strong style={{color:"#ffb800"}}>{writeTarget.name}</strong>. Cannot be undone.</div>
          </div>
          <CardChip card={writeTarget} selected/>
          <div style={{display:"flex",gap:8,marginTop:12}}>
            <button onClick={()=>setWriteStep("select")} style={{...btnS("#3a5060"),flex:1,padding:"11px"}}>← Back</button>
            <button onClick={()=>doWrite(writeTarget)} style={{flex:2,padding:"11px",background:"linear-gradient(135deg,#ffb800,#e09000)",color:"#060c12",borderRadius:10,fontSize:13,fontWeight:700}}>✍️ Start Writing</button>
          </div>
        </div>}

        {writeStep==="writing"&&<div style={{textAlign:"center",paddingTop:40}}>
          <div style={{width:70,height:70,margin:"0 auto 18px",border:"3px solid #ffb80060",borderTopColor:"#ffb800",borderRadius:"50%",animation:"spin .8s linear infinite"}}/>
          <div style={{fontSize:13,color:"#ffb800",...mono}}>Writing…</div>
          <div style={{fontSize:11,color:"#3a5060",marginTop:6}}>Keep card near device</div>
        </div>}

        {writeStep==="done"&&<div style={{textAlign:"center",paddingTop:40,animation:"fadeSlide .3s ease"}}>
          <div style={{width:72,height:72,margin:"0 auto 18px",background:"radial-gradient(circle,#00f5d420,transparent)",border:"2px solid #00f5d4",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28}}>✓</div>
          <div style={{fontSize:16,fontWeight:600,color:"#00f5d4",marginBottom:6}}>Write Complete!</div>
          <div style={{fontSize:11,color:"#3a5060",marginBottom:24}}>Card cloned successfully</div>
          <button onClick={()=>{setWriteStep("select");setWriteTarget(null)}} style={{...btnS("#00f5d4"),padding:"11px 28px"}}>Done</button>
        </div>}
      </div>}

    </div>

    {/* Toast */}
    {toast&&<div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:toast.type==="err"?"#2a0808":"#082820",border:"1px solid "+(toast.type==="err"?"#ff444460":"#00f5d460"),color:toast.type==="err"?"#ff8888":"#00f5d4",borderRadius:10,padding:"9px 18px",fontSize:12,...mono,animation:"fadeSlide .3s ease",zIndex:100,whiteSpace:"nowrap",boxShadow:"0 4px 24px #00000080"}}>{toast.msg}</div>}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
